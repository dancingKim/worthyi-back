spring:
  application:
    name: WorthyI
  profiles:
    active: local
  web:
    resources:
      add-mappings: false
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: your-google-client-id
            client-secret: your-google-client-secret
            scope: email, profile
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            authorization-grant-type: authorization_code
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            user-name-attribute: sub

management:
  endpoints:
    web:
      exposure:
        include: "health,info"

app:
  security:
    oauth2:
      allowed-redirect-origins: "http://localhost:3000,https://www.worthyilife.com,https://worthyilife.com"
      allowed-redirect-schemes: "worthyi"
      default-redirect-uri: "worthyi:/"
  avatar:
    google-ai-api-key: ${GOOGLE_AI_WORTHYI_KEY:}
    google-ai-default-model-preset: ${AVATAR_GOOGLE_AI_DEFAULT_MODEL_PRESET:BEST}
    google-ai-best-model: ${AVATAR_GOOGLE_AI_MODEL_BEST:gemini-3-pro-image-preview}
    google-ai-balanced-model: ${AVATAR_GOOGLE_AI_MODEL_BALANCED:gemini-3.1-flash-image-preview}
    google-ai-fast-model: ${AVATAR_GOOGLE_AI_MODEL_FAST:gemini-2.5-flash-image}
    google-ai-endpoint: ${AVATAR_GOOGLE_AI_ENDPOINT:https://generativelanguage.googleapis.com/v1beta/models}
    s3-bucket: ${AVATAR_IMAGE_BUCKET:worthyi-bucket-204098849975-ap-northeast-2-an}
    s3-prefix: ${AVATAR_IMAGE_PREFIX:avatars/users}
    default-reference-path: ${AVATAR_DEFAULT_REFERENCE_PATH:classpath:avatar/default-avatar-reference.png}
    signed-url-minutes: ${AVATAR_SIGNED_URL_MINUTES:30}
    max-prompt-length: ${AVATAR_MAX_PROMPT_LENGTH:400}
